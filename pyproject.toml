[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-laboral"
version = "0.1.0"
description = "Repositorio ligero para capturar y consultar normativa laboral peruana"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
release = ["pyinstaller>=6,<7"]

[project.scripts]
radar-laboral = "radar_laboral.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radar_laboral = ["templates/*.html"]
