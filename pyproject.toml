[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-laboral"
version = "0.1.0"
description = "Repositorio ligero para capturar y consultar normativa laboral peruana"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "waitress>=3.0,<4",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
release = ["pyinstaller>=6,<7"]

[project.scripts]
radar-laboral = "radar_laboral.app:main"
radar-laboral-sync = "radar_laboral.collectors.el_peruano_search:main"
radar-laboral-sync-daemon = "radar_laboral.sync_daemon:main"
radar-laboral-backfill = "radar_laboral.collectors.el_peruano_history:main"
radar-laboral-sync-tfl = "radar_laboral.collectors.sunafil_tfl:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radar_laboral = ["templates/*.html"]
