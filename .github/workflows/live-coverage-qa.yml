name: live-coverage-qa

on:
  pull_request:
    branches:
      - main

jobs:
  live-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Validate real daily coverage and API
        env:
          RADAR_DATA_DIR: ${{ runner.temp }}/radar-coverage-live
          RADAR_CATALOG_PATH: ${{ runner.temp }}/radar-coverage-live/catalog/norms.jsonl
          RADAR_COVERAGE_DAYS: "2"
          RADAR_ADMIN_TOKEN: ""
        run: |
          python - <<'PY'
          from datetime import date
          from unittest.mock import patch

          from radar_laboral.app import create_app
          from radar_laboral.collectors.el_peruano_history import backfill
          from radar_laboral.coverage import coverage_summary
          from radar_laboral.db import connect

          start = date(2026, 7, 22)
          end = date(2026, 7, 23)
          reference_today = date(2026, 7, 24)

          records = backfill(
              start,
              end,
              download_pdfs=False,
              page_delay_seconds=0,
              day_delay_seconds=0,
          )
          print("records loaded:", len(records))

          with connect() as conn:
              rows = conn.execute(
                  """
                  SELECT coverage_date, record_count, relevant_count, review_count, is_complete
                  FROM source_coverage_days
                  WHERE source = 'El Peruano'
                    AND coverage_date BETWEEN '2026-07-22' AND '2026-07-23'
                  ORDER BY coverage_date
                  """
              ).fetchall()

          rows = [dict(row) for row in rows]
          print("coverage rows:", rows)
          assert [row["coverage_date"] for row in rows] == ["2026-07-22", "2026-07-23"], rows
          assert all(row["is_complete"] == 1 for row in rows), rows
          assert all(row["record_count"] > 0 for row in rows), rows
          assert sum(row["record_count"] for row in rows) == len(records), (rows, len(records))

          summary = coverage_summary(reference_today, target_days=2)
          print("summary:", summary)
          assert summary["verified_days"] == 2, summary
          assert summary["missing_days"] == 0, summary
          assert summary["coverage_percent"] == 100.0, summary
          assert summary["window_start"] == "2026-07-22", summary
          assert summary["window_end"] == "2026-07-23", summary

          app = create_app()
          app.config.update(TESTING=True)
          client = app.test_client()
          with patch("radar_laboral.app._local_today", return_value=reference_today):
              api = client.get("/api/status")
              home = client.get("/")
              status_page = client.get("/status")

          assert api.status_code == 200
          payload = api.get_json()
          print("api coverage:", payload["coverage"])
          assert payload["coverage"]["verified_days"] == 2, payload["coverage"]
          assert payload["coverage"]["missing_days"] == 0, payload["coverage"]
          assert payload["coverage"]["coverage_percent"] == 100.0, payload["coverage"]

          home_text = home.get_data(as_text=True)
          status_text = status_page.get_data(as_text=True)
          assert "Cobertura verificada: <strong>2/2</strong> días" in home_text, home_text[:2000]
          assert "Cobertura histórica verificada al 100%" in home_text, home_text[:2000]
          assert "2 / 2 días" in status_text, status_text[:2000]
          assert "100.0%" in status_text, status_text[:2000]
          PY
