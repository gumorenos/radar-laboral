name: live-labor-filter-qa

on:
  pull_request:
    branches:
      - main

jobs:
  live-labor-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Validate real backfill, classification and homepage visibility
        env:
          RADAR_DATA_DIR: ${{ runner.temp }}/radar-live
          RADAR_CATALOG_PATH: ${{ runner.temp }}/radar-live/catalog/norms.jsonl
          RADAR_ADMIN_TOKEN: ""
        run: |
          python - <<'PY'
          from datetime import date

          from radar_laboral.app import create_app
          from radar_laboral.collectors.el_peruano_history import backfill
          from radar_laboral.db import get_norm, norm_stats

          records = backfill(
              date(2026, 7, 22),
              date(2026, 7, 23),
              download_pdfs=False,
              page_delay_seconds=0,
              day_delay_seconds=0,
          )
          print("historical records:", len(records))
          stats = norm_stats()
          print("stats:", stats)

          by_number = {
              str(item.get("number") or ""): item
              for item in records
              if item.get("number")
          }
          telework = by_number.get("009-2026-TR")
          inspection = by_number.get("194-2026-TR")
          personnel = by_number.get("193-2026-TR")
          print("telework:", telework)
          print("inspection:", inspection)
          print("personnel:", personnel)

          assert telework is not None
          assert telework["publication_date"] == "2026-07-22"
          assert telework["labor_relevance"] == "relevant"
          assert "Teletrabajo" in str(telework.get("topic") or "")

          assert inspection is not None
          assert inspection["publication_date"] == "2026-07-23"
          assert inspection["labor_relevance"] == "relevant"
          assert "Inspección laboral" in str(inspection.get("topic") or "")

          assert personnel is not None
          assert personnel["labor_relevance"] == "not_labor", personnel
          assert stats["relevant"] >= 2

          app = create_app()
          app.config.update(TESTING=True)
          client = app.test_client()

          home = client.get("/")
          assert home.status_code == 200
          text = home.get_data(as_text=True)
          assert "Laborales + por revisar" in text
          assert "009-2026-TR" in text, "DS 009 no visible en portada tracked"
          assert "194-2026-TR" in text, "RM 194 no visible en portada tracked"
          assert "193-2026-TR" not in text, "acto administrativo apareció en portada tracked"

          relevant_only = client.get("/", query_string={"relevance": "relevant"})
          relevant_text = relevant_only.get_data(as_text=True)
          assert "009-2026-TR" in relevant_text
          assert "194-2026-TR" in relevant_text

          status = client.get("/api/status").get_json()
          print("api status:", status)
          assert status["date_bounds"] == {
              "earliest": "2026-07-22",
              "latest": "2026-07-23",
          }
          PY
