name: live-backfill-qa

on:
  push:
    branches:
      - feat/historical-backfill-v2

jobs:
  live-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Validate known historical day against El Peruano
        env:
          RADAR_DATA_DIR: ${{ runner.temp }}/radar-live
          RADAR_CATALOG_PATH: ${{ runner.temp }}/radar-live/catalog/norms.jsonl
        run: |
          radar-laboral-backfill \
            --from 2026-08-01 \
            --to 2026-08-01 \
            --no-pdf \
            --page-delay 0 \
            --day-delay 0
          python - <<'PY'
          from radar_laboral.db import connect

          with connect() as conn:
              total = conn.execute(
                  "SELECT COUNT(*) FROM norms WHERE publication_date = '2026-08-01'"
              ).fetchone()[0]
              by_edition = dict(
                  conn.execute(
                      "SELECT edition, COUNT(*) FROM norms "
                      "WHERE publication_date = '2026-08-01' GROUP BY edition"
                  ).fetchall()
              )
              sync = conn.execute(
                  "SELECT status, records_seen FROM sync_runs "
                  "WHERE source = 'El Peruano histórico' ORDER BY id DESC LIMIT 1"
              ).fetchone()

          print("total:", total)
          print("by_edition:", by_edition)
          print("sync:", tuple(sync))
          assert total == 140, total
          assert by_edition.get("regular") == 124, by_edition
          assert by_edition.get("extraordinary") == 16, by_edition
          assert tuple(sync) == ("success", 140), tuple(sync)
          PY
      - name: Validate explicit empty day
        env:
          RADAR_DATA_DIR: ${{ runner.temp }}/radar-live
          RADAR_CATALOG_PATH: ${{ runner.temp }}/radar-live/catalog/norms.jsonl
        run: |
          radar-laboral-sync --date 2026-08-23 --no-pdf
          python - <<'PY'
          from radar_laboral.db import connect

          with connect() as conn:
              sync = conn.execute(
                  "SELECT status, records_seen FROM sync_runs "
                  "WHERE source = 'El Peruano' ORDER BY id DESC LIMIT 1"
              ).fetchone()
          print("empty-day sync:", tuple(sync))
          assert tuple(sync) == ("success", 0), tuple(sync)
          PY
