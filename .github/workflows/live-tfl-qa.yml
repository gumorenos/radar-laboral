name: live-tfl-qa

on:
  pull_request:
    branches:
      - main

jobs:
  live-tfl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Inspect live SUNAFIL Sala Plena detail
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          from radar_laboral.collectors.sunafil_tfl import fetch_listing_page

          session = requests.Session()
          session.headers.update({
              "User-Agent": "radar-laboral-live-qa/0.1 (+https://github.com/gumorenos/radar-laboral)",
              "Accept-Language": "es-PE,es;q=0.9",
          })

          unique = {}
          pagination = []
          for sheet in (1, 2, 3):
              records, has_next = fetch_listing_page(session, sheet)
              print("sheet", sheet, "records", len(records), "has_next", has_next)
              pagination.append(has_next)
              for record in records:
                  unique[record["id"]] = record

          print("unique listing records:", len(unique))
          assert len(unique) >= 53, len(unique)
          control = unique.get("sunafil-tfl:6556395")
          assert control is not None
          assert control["number"] == "001-2025-SUNAFIL-TFL", control
          assert control["publication_date"] == "2025-03-10", control
          assert pagination == [True, True, False], pagination

          url = "https://www.gob.pe/institucion/sunafil/normas-legales/6556395-001-2025-sunafil-tfl"
          response = session.get(url, timeout=30)
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "html.parser")

          print("status:", response.status_code, "bytes:", len(response.text))
          for meta in soup.find_all("meta"):
              content = str(meta.get("content") or "")
              name = str(meta.get("name") or meta.get("property") or "")
              if "observancia" in content.lower() or "precedent" in content.lower() or name in {"description", "og:description", "twitter:description"}:
                  print("META", name, repr(content[:2000]))

          for script in soup.find_all("script"):
              text = script.string or script.get_text(" ", strip=True)
              if "observancia" in text.lower() or "precedent" in text.lower():
                  print("SCRIPT", str(script.get("type") or ""), repr(text[:4000]))

          for node in soup.find_all(True):
              attrs = " ".join(str(v) for v in node.attrs.values())
              text = node.get_text(" ", strip=True)
              combined = attrs + " " + text
              if "observancia obligatoria" in combined.lower():
                  print("NODE", node.name, repr(attrs[:1000]), repr(text[:3000]))
                  break
          PY
