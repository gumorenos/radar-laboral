name: live-tfl-qa

on:
  pull_request:
    branches:
      - main

jobs:
  live-tfl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Inspect smallest SUNAFIL summary nodes
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          from radar_laboral.collectors.sunafil_tfl import fetch_listing_page

          session = requests.Session()
          session.headers.update({
              "User-Agent": "radar-laboral-live-qa/0.1 (+https://github.com/gumorenos/radar-laboral)",
              "Accept-Language": "es-PE,es;q=0.9",
          })

          unique = {}
          pagination = []
          for sheet in (1, 2, 3):
              records, has_next = fetch_listing_page(session, sheet)
              pagination.append(has_next)
              for record in records:
                  unique[record["id"]] = record
          assert len(unique) >= 53, len(unique)
          assert pagination == [True, True, False], pagination

          url = "https://www.gob.pe/institucion/sunafil/normas-legales/6556395-001-2025-sunafil-tfl"
          response = session.get(url, timeout=30)
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "html.parser")

          matches = []
          for index, node in enumerate(soup.find_all(True)):
              text = " ".join(node.get_text(" ", strip=True).split())
              attrs = " ".join(f"{k}={v}" for k, v in node.attrs.items())
              attr_text = attrs.lower()
              text_lower = text.lower()
              if "observancia obligatoria" in text_lower or "observancia obligatoria" in attr_text:
                  matches.append((len(text), index, node.name, attrs, text))

          matches.sort()
          print("matching nodes:", len(matches))
          for length, index, tag, attrs, text in matches[:12]:
              print("NODE", "len=", length, "idx=", index, "tag=", tag)
              print("ATTRS", repr(attrs[:1500]))
              print("TEXT", repr(text[:4500]))
              print("---")

          assert matches, "No DOM node contains the complete mandatory-precedent phrase"
          PY
