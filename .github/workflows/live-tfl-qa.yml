name: live-tfl-qa

on:
  pull_request:
    branches:
      - main

jobs:
  live-tfl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Validate live SUNAFIL Sala Plena source and PDF cache
        env:
          RADAR_DATA_DIR: ${{ runner.temp }}/radar-tfl-live
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          import requests

          from radar_laboral.collectors.sunafil_tfl import (
              cache_pdf,
              fetch_detail,
              fetch_listing_page,
          )
          from radar_laboral.db import data_dir, init_db

          init_db()
          session = requests.Session()
          session.headers.update({
              "User-Agent": "radar-laboral-live-qa/0.1 (+https://github.com/gumorenos/radar-laboral)",
              "Accept-Language": "es-PE,es;q=0.9",
          })

          unique = {}
          pagination = []
          for sheet in (1, 2, 3):
              records, has_next = fetch_listing_page(session, sheet)
              print("sheet", sheet, "records", len(records), "has_next", has_next)
              pagination.append(has_next)
              for record in records:
                  unique[record["id"]] = record

          print("unique listing records:", len(unique))
          assert len(unique) >= 53, len(unique)
          control = unique.get("sunafil-tfl:6556395")
          assert control is not None
          assert control["number"] == "001-2025-SUNAFIL-TFL", control
          assert control["publication_date"] == "2025-03-10", control
          assert pagination == [True, True, False], pagination

          detail = fetch_detail(
              session,
              "https://www.gob.pe/institucion/sunafil/normas-legales/6556395-001-2025-sunafil-tfl",
          )
          print("detail number:", detail["number"])
          print("detail date:", detail["publication_date"])
          print("summary length:", len(detail["summary"] or ""))
          print("binding:", detail["binding_level"])
          print("pdf:", detail["pdf_url"])
          assert detail["number"] == "001-2025-SUNAFIL-TFL", detail
          assert detail["publication_date"] == "2025-03-10", detail
          assert detail["summary"] and "observancia obligatoria" in detail["summary"].lower(), detail
          assert detail["binding_level"] == "precedente administrativo de observancia obligatoria", detail
          assert detail["pdf_url"] and "gob.pe" in detail["pdf_url"], detail

          cache_pdf(session, detail)
          assert detail["pdf_path"], detail
          assert detail["sha256"] and len(detail["sha256"]) == 64, detail
          pdf_path = data_dir() / str(detail["pdf_path"])
          payload = pdf_path.read_bytes()
          assert payload.startswith(b"%PDF"), payload[:16]
          assert hashlib.sha256(payload).hexdigest() == detail["sha256"]
          first_hash = detail["sha256"]
          print("cached PDF:", pdf_path, "bytes:", len(payload), "sha256:", first_hash)

          original_get = session.get
          def no_network(*args, **kwargs):
              raise AssertionError("cache_pdf attempted network instead of reusing valid local PDF")
          session.get = no_network
          cache_pdf(session, detail)
          session.get = original_get
          assert detail["sha256"] == first_hash
          print("second cache call reused local PDF without network")
          PY
